name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # SPEC §8.1a pins PostgreSQL 16. Trust auth mirrors docker-compose.yml, so no
        # credential exists in CI either. The service container has no
        # docker-entrypoint-initdb.d hook, so studio_app does not exist here — which
        # is exactly why revision 0001 creates it rather than relying on the local
        # init script.
        image: postgres:16
        env:
          POSTGRES_DB: studio_manager
          POSTGRES_USER: studio_migrator
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U studio_migrator -d studio_manager"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://studio_app@127.0.0.1:55433/studio_manager
      MIGRATION_DATABASE_URL: postgresql+psycopg://studio_migrator@127.0.0.1:55433/studio_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app scripts tests && ruff format --check app scripts tests
      - name: Typecheck
        run: mypy app scripts
      - name: Migrate
        # The DB tests fail rather than skip when no database is reachable, so this is
        # part of the gate and not setup around it.
        run: alembic upgrade head
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        # Must precede Tests: the sw-precache specs assert the built precache
        # manifest, which is the only way to catch a font silently failing to
        # precache (§6.1). Without this they pass locally on a stale dist/ and
        # fail on a clean checkout.
        run: npm run build
      - name: Tests
        run: npm run test
      - name: i18n parity
        # SPEC §9 — Hebrew is the reference locale. en is strict, ru reports until §15
        # item 9 (the ru translation source) lands; the policy lives in the script.
        run: node scripts/i18n-parity.mjs

  generated:
    # SPEC §8.2 — a diff in generated output that is not committed fails the build,
    # so a breaking backend change fails here rather than in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: web
      - name: Regenerate the OpenAPI schema and the TypeScript client
        run: |
          python scripts/export_openapi.py
          cd web && npx openapi-typescript ../openapi.json -o packages/api-client/src/schema.d.ts
      - name: Fail if the generated output is not committed
        # Run from the repo root: a pathspec resolved from web/ matches nothing
        # and the gate passes silently.
        run: |
          if ! git diff --exit-code -- openapi.json web/packages/api-client/src/schema.d.ts; then
            echo "::error::openapi.json / api-client is stale. Run scripts/ci-local.sh and commit the result."
            exit 1
          fi

  installability:
    # §6.5 — the install is the main adoption risk. A regression must fail here,
    # not on a parent's phone. There is no store listing to fall back on.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npm run installability

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r requirements-dev.txt
      - name: npm dependency audit
        run: npm audit --audit-level=high
        working-directory: web
