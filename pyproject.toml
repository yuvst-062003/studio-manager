[project]
name = "studio-manager"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: requires a live PostgreSQL (./scripts/dev-db.sh up)",
    "slow: runs the full lane-check; excluded with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[[tool.mypy.overrides]]
# Alembic generates these; `op` and `sa` are untyped at the call sites it writes.
module = "alembic.versions.*"
ignore_errors = true
