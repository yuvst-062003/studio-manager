[project]
name = "studio-manager"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# tests/contracts/_pending/ asserts against tables app/models/_pending/ deliberately keeps
# out of Base.metadata until their wave. Each wave's contract commit moves its model file
# and its test file up together. See tests/contracts/_pending/__init__.py.
norecursedirs = ["_pending"]
markers = [
    "db: requires a live PostgreSQL (./scripts/dev-db.sh up)",
    "slow: runs the full lane-check; excluded with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "scripts", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "scripts", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[[tool.mypy.overrides]]
# Alembic generates these; `op` and `sa` are untyped at the call sites it writes.
module = "alembic.versions.*"
ignore_errors = true

[[tool.mypy.overrides]]
# HB-push-transport. No stubs and no py.typed marker upstream; app/services/comms/push.py
# is the only file that imports it, and its own functions are still fully typed.
module = "pywebpush"
ignore_missing_imports = true
