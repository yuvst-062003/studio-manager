# Local PostgreSQL 18 (SPEC §8.1a). psql is not installed on this machine; docker is.
#
# Trust auth, bound to loopback only. That is deliberate: it means no credential is
# ever written into this repository, so there is nothing here for a secret scanner to
# find and nothing for a developer to leak. Staging and production get real
# credentials from Railway, injected at runtime.
#
# Port 55433, not 5432 and not 55432 — both are already in use on the machine this
# was built on, and a port collision reads as "postgres is broken" rather than
# "wrong database".
# The project name is pinned rather than inferred. `docker compose` names its project
# after the directory it is run from, and every lane runs in a git worktree — so from
# `../sm-e2e` the container this file describes is invisible: `dev-db.sh up` fails on a
# name conflict it cannot explain, and `scripts/e2e-backend.sh`'s readiness probe reports
# `service "db" is not running` and kills the whole Playwright webServer block. Pinning it
# is a no-op in the main checkout, whose directory already carries this name.
name: studio-manager

services:
  db:
    image: postgres:18
    container_name: studio-manager-db
    environment:
      POSTGRES_DB: studio_manager
      POSTGRES_USER: studio_migrator
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      # No docker-entrypoint-initdb.d mount, deliberately. The runtime role comes
      # from the migrations in every environment: revision 0001 creates it, revision
      # 0011 grants LOGIN (an attribute, not a credential -- see its docstring). A
      # local-only init script is what let local and CI drift: locally the role
      # arrived WITH LOGIN, CI had no init hook, and only the runner noticed.
      # PostgreSQL 18's image moved the data directory: the mount goes at
      # /var/lib/postgresql and the server puts its data in a version-named
      # subdirectory. Mounting /var/lib/postgresql/data (correct for 16 and
      # earlier) makes the container refuse to start.
      - studio-manager-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_migrator -d studio_manager"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  studio-manager-pgdata:
