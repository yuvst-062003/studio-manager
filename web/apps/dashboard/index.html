<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f1" />

    <!-- iOS ignores the manifest for the home-screen icon and reads these
         instead. Without them the icon is a screenshot of the page (§6.5). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ניהול" />
    <title>Gladiator Manager</title>
  </head>
  <body>
    <!-- **The first pixel is already the loading screen.**

         Without this there were THREE screens on a cold start, not two: the OS splash from
         the manifest, then this page painted in `--ground` (cream) the moment the CSS
         parsed, and only THEN React's own splash. The middle one is the white flash the
         owner kept seeing after the manifest was already fixed — it happens before any
         JavaScript exists, so nothing in the app could have removed it.

         Inline, and deliberately: it must paint without the CSS bundle, without the JS
         bundle and without a font. The colours are the same literals as
         `packages/ui/src/theme.ts::SPLASH_GROUND` and `first-run/splash.css`, so the OS
         splash, this, and React's splash are one continuous screen — which is what makes a
         launch read as "waiting, then the app" rather than as three things flashing past.

         `main.tsx` removes it once React has painted. Inside #root would be tidier and is
         wrong: React clears the container on first render, which would take the splash away
         at mount instead of when there is something to replace it with. -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:#101828">
      <p style="margin:0;color:#fff;font:800 clamp(1.75rem,9vw,2.75rem)/1 Helvetica,sans-serif;letter-spacing:.18em">GLADIATOR<br><span style="font-size:.42em;font-weight:600;letter-spacing:.32em;opacity:.7">CLUB</span></p>
      <div aria-hidden="true" style="display:flex;gap:.6rem">
        <span style="width:.6rem;height:.6rem;border-radius:50%;background:#cbd5e1;opacity:.35"></span>
        <span style="width:.6rem;height:.6rem;border-radius:50%;background:#cbd5e1;opacity:1"></span>
        <span style="width:.6rem;height:.6rem;border-radius:50%;background:#cbd5e1;opacity:.6"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
