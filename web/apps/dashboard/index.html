<!doctype html>
<!-- `data-surface="studio-os"` puts the manager dashboard in its own dark-mint register
     rather than the neutral inward palette it shared with the staff app until the
     2026-09-10 redesign. The values are the [data-surface="studio-os"] block in
     packages/ui/src/tokens.css; ThemeProvider still owns light/dark/system on top. -->
<html lang="he" dir="rtl" data-theme="light" data-surface="studio-os">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f5f3" />

    <!-- iOS ignores the manifest for the home-screen icon and reads these
         instead. Without them the icon is a screenshot of the page (§6.5). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ניהול" />
    <title>Gladiator Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
