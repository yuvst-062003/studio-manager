<!doctype html>
<!-- `data-surface="staff"` puts this app in its own cool blue-grey palette rather than
     the warm neutral the manager dashboard keeps. The two used to share one palette
     (D14); the values are the [data-surface="staff"] block in packages/ui/src/tokens.css.

     On <html> and not on <body>, same reasoning as the parent app's outward marker:
     tokens.css sets `html { background: var(--ground) }`, so a marker on the body
     leaves the page behind it painted the dashboard's warm grey. -->
<html lang="he" dir="rtl" data-theme="light" data-surface="staff">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1, user-scalable=no` — a native app does not scale under two
         fingers. Honoured by Android, and by iOS for a home-screen web app; iOS Safari in
         a browser TAB ignores both since iOS 10, which is what `lockViewportZoom()` in
         main.tsx is for. The accessibility trade this makes is argued there, and rests on
         AccessibilityMenu's own text scaling being the replacement. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- The STAFF ground. ThemeProvider rewrites this on mount for dark mode; this
         value is what paints the status bar in the moments before it does, so a stale
         one is a visible flash of the wrong palette on every cold start. -->
    <meta name="theme-color" content="#f6f9fd" />

    <!-- iOS ignores the manifest for the home-screen icon and reads these
         instead. Without them the icon is a screenshot of the page (§6.5). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="צוות" />
    <title>Gladiator Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
