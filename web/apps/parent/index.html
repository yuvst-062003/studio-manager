<!doctype html>
<!-- `data-surface="outward"` is what puts this app in the club's brand rather than the
     neutral working palette the staff app and the dashboard wear. The rule and its
     reasoning are in docs/design/decisions.md; the values are the [data-surface="outward"]
     block in packages/ui/src/tokens.css.

     On <html> and not on <body>: tokens.css sets `html { background: var(--ground) }`, so
     a marker on the body leaves the page behind it painted the inward warm grey — visible
     as a mismatched band under a short screen and behind the overscroll on iOS. -->
<html lang="he" dir="rtl" data-theme="light" data-surface="outward">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1, user-scalable=no` — a native app does not scale under two
         fingers. Honoured by Android, and by iOS for a home-screen web app; iOS Safari in
         a browser TAB ignores both since iOS 10, which is what `lockViewportZoom()` in
         main.tsx is for. The accessibility trade this makes is argued there, and rests on
         AccessibilityMenu's own text scaling being the replacement. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- The OUTWARD ground. ThemeProvider rewrites this on mount for dark mode; this
         value is what paints the status bar in the moments before it does, so a stale one
         is a visible flash of the wrong palette on every cold start. -->
    <meta name="theme-color" content="#fcf9f8" />

    <!-- iOS ignores the manifest for the home-screen icon and reads these
         instead. Without them the icon is a screenshot of the page (§6.5). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="הורים" />
    <title>Gladiator</title>
    <!-- The launch pre-paint. iOS holds the navy launch image until the browser's first
         paint, and the first paint is this document — which used to be the cream ground
         with nothing on it, for the ~100ms until React mounted. This draws the same navy
         and the same mark as `LaunchScreen` (which removes it in a layout effect, the same
         frame it first paints its own), so nothing is seen to change hands. The ground is
         the literal `generate-splash.mjs` paints the image with, not the brand token, for
         the reason given there: the token flips in dark mode and the image does not. -->
    <style>
      #launch {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #001849;
        color: #fff;
        direction: ltr;
        font-size: clamp(1.75rem, 9vw, 2.75rem);
      }
      #launch > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35em;
      }
      #launch b {
        font: 800 1em / 1 Archivo, 'Rubik Variable', sans-serif;
        letter-spacing: 0.18em;
        margin-inline-end: -0.18em;
      }
      #launch small {
        font: 600 0.42em / 1 Archivo, 'Rubik Variable', sans-serif;
        letter-spacing: 0.32em;
        margin-inline-end: -0.32em;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="launch" aria-hidden="true"><div><b>GLADIATOR</b><small>CLUB</small></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
