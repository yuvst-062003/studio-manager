<!doctype html>
<!-- `data-surface="outward"` is what puts this app in the club's brand rather than the
     neutral working palette the staff app and the dashboard wear. The rule and its
     reasoning are in docs/design/decisions.md; the values are the [data-surface="outward"]
     block in packages/ui/src/tokens.css.

     On <html> and not on <body>: tokens.css sets `html { background: var(--ground) }`, so
     a marker on the body leaves the page behind it painted the inward warm grey — visible
     as a mismatched band under a short screen and behind the overscroll on iOS. -->
<html lang="he" dir="rtl" data-theme="light" data-surface="outward">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1, user-scalable=no` — a native app does not scale under two
         fingers. Honoured by Android, and by iOS for a home-screen web app; iOS Safari in
         a browser TAB ignores both since iOS 10, which is what `lockViewportZoom()` in
         main.tsx is for. The accessibility trade this makes is argued there, and rests on
         AccessibilityMenu's own text scaling being the replacement. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- The OUTWARD ground. ThemeProvider rewrites this on mount for dark mode; this
         value is what paints the status bar in the moments before it does, so a stale one
         is a visible flash of the wrong palette on every cold start. -->
    <meta name="theme-color" content="#fcf9f8" />

    <!-- iOS ignores the manifest for the home-screen icon and reads these
         instead. Without them the icon is a screenshot of the page (§6.5). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="הורים" />
    <title>Gladiator</title>
  </head>
  <body>
    <!-- **The first pixel is already the loading screen.**

         Without this there were THREE screens on a cold start, not two: the OS splash from
         the manifest, then this page painted in `--ground` (cream) the moment the CSS
         parsed, and only THEN React's own splash. The middle one is the white flash the
         owner kept seeing after the manifest was already fixed — it happens before any
         JavaScript exists, so nothing in the app could have removed it.

         Inline, and deliberately: it must paint without the CSS bundle, without the JS
         bundle and without a font. The colours are the same literals as
         `packages/ui/src/theme.ts::SPLASH_GROUND` and `first-run/splash.css`, so the OS
         splash, this, and React's splash are one continuous screen — which is what makes a
         launch read as "waiting, then the app" rather than as three things flashing past.

         `main.tsx` removes it once React has painted. Inside #root would be tidier and is
         wrong: React clears the container on first render, which would take the splash away
         at mount instead of when there is something to replace it with. -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;background:#001849">
      <img src="/clubs/gladiator-logo.png" alt="" width="150" height="150" style="width:42vw;max-width:150px;min-width:112px;height:auto;padding:.9rem;border-radius:50%;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)">
      <div aria-hidden="true" style="display:flex;gap:.6rem">
        <span style="width:.6rem;height:.6rem;border-radius:50%;background:#aac7ff;opacity:.35"></span>
        <span style="width:.6rem;height:.6rem;border-radius:50%;background:#aac7ff;opacity:1"></span>
        <span style="width:.6rem;height:.6rem;border-radius:50%;background:#aac7ff;opacity:.6"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
