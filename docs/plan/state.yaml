      WHAT IS LEFT is the process leak rather than the code: revision 0010 was authored in
      a lane worktree, against CLAUDE.md's rule that main owns the migrations directory and
      that one revision per wave lands in the wave's contract commit. It costs this branch
      nothing now and will conflict at merge.
