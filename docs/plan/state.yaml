    title: W2 closed with its E2E exit gate unmet, and the W2 subsets owed in W3
    why: >-
      W2's stated exit gate is E2E-5 (a schedule change rewrites only the future) and
      E2E-1a (registration → approval → active). Neither was met. The wave closed on its
      lane work instead, deliberately, and this entry is the record that the gate is
