  - id: HB-e2e-registration-approval
    kind: carried
    title: Approving a parent-app registration request 500s for any guardian without an email
    why: >-
      `RegistrationService.approve` resolves the matched parent and then passes
      `guardian_email=parent.email` down to `StudentService.create`, commenting "reuse their
      VERIFIED address so create() links rather than duplicates. §5.4a: No second
      invitation, no second account, no second login."

      It reuses the wrong column. `match_person` keys on the AuthIdentity's verified address
      and never on `person.email` — matching.py's own docstring says "person.email alone is
      therefore never a key". The nine §19.3 personas carry no `person.email` and no phone,
      so the match returns None, a duplicate parent Person is created, and an invitation is
      issued with both recipient columns null, violating
      `ck_invitation_invitation_has_a_recipient`. HTTP 500.

      In the demo studio that is EVERY parent-app registration request, which is every one a
      developer or an E2E suite can make. It is latent in production too: any matched
      guardian whose Person row has no address takes the same branch.

      The fix is to pass the matched person's ID rather than re-deriving them from an
      address. §5.4a's trial booking already does exactly that — `TrialService` attaches
      `Guardian(person_id=parent.id)` directly — which is why the E2E fixture reaches a
      guardian link at all.

      CLOSED 2026-08-26. `StudentService.create` takes an optional `guardian_person_id`
      that short-circuits the match, and `approve()` passes the id it already resolved.
      Covered by a backend test that clears the Person's address — the shape the fixtures
      never produced and §19.3 always does — and by E2E-1's second test end to end.
