holdbacks:
  - id: HB-w2-e2e-gate
    kind: carried
    title: W2 closed with its E2E exit gate unmet, and the W2 subsets owed in W3
    why: >-
      W2's stated exit gate is E2E-5 (a schedule change rewrites only the future) and
      E2E-1a (registration → approval → active). Neither was met. The wave closed on its
      lane work instead, deliberately, and this entry is the record that the gate is
      outstanding rather than passed.

      Both spec files exist, and both were authored as the W3-COMPLETE flows rather than as
      W2 subsets — which is why running them as written cannot be W2's gate.
      e2e/01-registration-to-active.spec.ts states its own scope on line 7: "Gate for: W2
      (as E2E-1a, without the health step) and W3 (complete, with it)". The health step is
      M4's and does not exist yet, so the file as written is W3's flow, and the W2 subset of
      it has never been written down. E2E-5 has the same shape for a second and independent
      reason: its first test finishes by asserting `attendance-taken` on a past session,
      which is W3's attendance work in M5 — so even the pure schedule flow, whose product
      code did ship this wave, cannot pass end to end against W2's code alone.

      The alternative was to author two throwaway W2-scoped specs now and rewrite both in
      W3 when the real flows land. That was weighed and declined: it buys a green tick this
      week for two files that are deleted next week, and it is the kind of gate that teaches
      people to stop reading gates. Un-fixme'ing the existing specs was declined for the
      plainer reason that it would put a permanently red gate in front of work nobody has
      been asked to do yet.

      What is owed in W3, and what closes this: the W2 subset of E2E-5 — the schedule
      change, the impact preview's three named protections, and the parent calendar —
      without the attendance assertion; and the W2 subset of E2E-1a — the landing page,
      sign-in-first booking, the approval queue and the student going active — without the
      health step. W3's own gate already names the complete versions of both flows, so
      these ride in beside them rather than needing a wave of their own.
    blocks: W3
    status: open
    opened: 2026-08-26
    closed: null
    source: >-
      SPEC §13 flows 1 and 5 · docs/plan/milestone-plan.md §2.1 ·
      e2e/01-registration-to-active.spec.ts:7 · e2e/05-schedule-change.spec.ts
