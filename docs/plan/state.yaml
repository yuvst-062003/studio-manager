      amount_mismatch leaves the order `amount_mismatch` with the charges open and the raw
      "319.99" in the IPN log, forged_ref leaves the order `pending` and lands unmatched,
      and a duplicate delivery creates no second payment.

      What closes this: a manager-facing read over payment orders, filterable by status —
      or a counts endpoint for the alert centre, which is the narrower answer.

