  - id: HB-c5-rollover-artboard
    kind: conflict
    title: C5 — the rollover wizard has no artboard
    why: >-
      §5.15 calls it the single highest-leverage screen in the product and specs seven
      steps, but the canvas has 61 screens and none of them is this one. Every other
      major flow was designed before it was built. Either design it, or accept it ships
      without a visual reference and say so out loud.

      RESOLVED 2026-08-26 (W6) as SHIPS WITHOUT AN ARTBOARD, said out loud. Designing a 62nd
      screen inside the wave whose exit gate is "all 61 artboards pass the a11y/RTL sweep"
      would have moved the gate while standing on it, and the canvas count is asserted by a
      test for exactly that reason. The wizard is instead built against a REFERENCE that
      already exists and is already swept: `packages/ui/src/setup-wizard/`, whose step rail,
      resume rule, per-step contract and status-as-words labelling the rollover mirrors
      component for component. That is a stronger constraint than a fresh mockup, because it
      is executable — the setup wizard's own tests fail if the pattern drifts.

      INVENTORY.md stays at 61. Anyone adding the artboard later should add it to the count
      and to test_canvas_matches_spec.py in the same commit.
    blocks: W6
    status: closed
    opened: 2026-08-24
    closed: 2026-08-26
    source: docs/plan/milestone-plan.md Part 5
  - id: HB-c10-3f-health-toggle
    kind: conflict
    title: C10 — artboard 3f draws a setting SPEC §5.5 says must not exist
    why: >-
      3f's הגדרות panel includes a חסימת השתתפות ללא הצהרת בריאות toggle. §5.5 states in as
      many words that there is no block_attendance_without_health setting — "nothing to
      configure" — because a hard block stops the RECORD from being accurate without making
      anyone safer, and the decision stays with the people in the room. M1.10 built the panel
      without that row and carries a test that fails if it is added back from the canvas. The
      conflict is in the mockup, not the code: either the artboard loses the row or §5.5
      changes, and the mockup is what a human opens at 2am. Same family as C9.

      RESOLVED 2026-08-26 (W6): THE ARTBOARD LOSES THE ROW. Three reasons, in order of
      weight. First, §5.5's rule is reasoned rather than incidental — a hard block stops the
      RECORD from being accurate without making anyone safer, because the coach controls the
      mat physically and can decline the child; changing the spec would mean re-opening a
      safety argument in order to keep a mockup. Second, the drawn row contradicted itself:
      its own subtitle read "המאמן יראה התראה, החניך לא ייחסם אוטומטית", so it was a switch
      labelled *block* that promised not to block — as drawn it did not describe a hard block
      at all. Third, the code has been hardened against it in sixteen files since M1.10 and
      carries a test that fails if the panel regains the row; the cheap edit is the one row
      in the mockup, not the sixteen files plus a spec change.

      3f now matches the shipped panel exactly: three toggles, none of them this one. The
      artboard carries a comment saying what was removed and why, and
      tests/contracts/test_canvas_matches_spec.py fails if it reappears — so the negative is
      now asserted against the mockup as well as against the component.
    blocks: W6
    status: closed
    opened: 2026-08-25
    closed: 2026-08-26
    source: SPEC §5.5 · docs/design/canvas/03-manager-dashboard artboard 3f
  - id: HB-c9-canvas
    kind: conflict
