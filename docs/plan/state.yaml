  - id: HB-w5-lane-fixtures
    kind: carried
    title: W5's lane fixtures (§2.2 item 8) are not written, and both lanes start without them
    why: >-
      §2.2 item 8 puts `tests/<vertical>/conftest.py` in the contract commit, and W4 shipped
      exactly that as its own commit in the pre-worktree sequence — `test(w4): the fixtures
      each W4 lane starts from`, 1000 lines across nine files, one conftest plus one
      `test_the_lane_fixtures_build.py` per vertical. W5's contract commit did not carry the
      equivalent for `comms`, `reports` and `privacy`.

      The shape is not optional, and the reason is mechanical. A `tests/<vertical>/`
      directory holding only a conftest collects no tests, and pytest exits 5 on that —
      which `lane-check.sh` turns into a RED gate for a lane that has done nothing wrong.
      That is why each W4 directory also carries a test that builds every fixture. Creating
      the conftests without the smoke test would break the three lane gates this same commit
      added.

      What this costs if it is not closed first: both W5 lanes write their own caller
      machinery, and they will not agree. W4's conftests pin one instant across billing and
      events on purpose, because two conftests disagreeing about what month it is makes two
      lanes' tests disagree about one flow. M8's notification and M9's at-risk job are a
      caller/callee pair across exactly that seam.

      What closes this: three conftests plus three fixture-build tests, on `main`, before the
      worktrees are created. It is the same work W4 did and the same size.
