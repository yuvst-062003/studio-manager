  - id: HB-e2e-offline-bulk-op
    kind: carried
    title: A queued bulk mark can never flush — `flush` has no route for it
    why: >-
      `RosterScreen.bulkPresent` queues one `attendance.bulk` op carrying a
      `client_mark_id_prefix` and no `student_id`, which is right: §5.7's bulk is one
      instruction about a whole roster, and §10.5 protects a parent's pre-report
      "regardless of timestamp" — including one filed AFTER the coach tapped, which only
      the server can apply at replay time.

      But `sync.ts`'s `flush` groups every pending op by session and posts it to
      `/attendance/batch` whatever its `kind`, and `AttendanceIn` requires both
      `student_id` and `status`. So a queued bulk is refused 422 for ever. It should go to
      `POST /sessions/{id}/attendance/bulk-present`, which exists and does the right thing.

      Found by E2E-2, which asserts §10.5's rule through that endpoint instead and says so.
      Expanding the bulk into one mark per student on the client would dodge it and would
      be wrong for the reason above.

      Worse than it first reads: §10.3 queues EVERY mark regardless of network, so the
      bulk button never persisted anything at ALL — online or offline. The screen is
      optimistic by design, so it looked like it worked every time.

      CLOSED 2026-08-26, with permission, since the alternative was leaving a daily coach
      action broken. `flush` now groups by session AND by shape and sends a bulk to
      `/sessions/{id}/attendance/bulk-present`. Three unit tests cover it, and E2E-2's
      second test walks it through the real queued path rather than around it.

      The flusher also drains on a queue write now, not only on a timer — an online mark
      used to wait up to fifteen seconds for the next tick.
