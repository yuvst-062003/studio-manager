      third test is absent rather than written against an implementation that is not there.

      The three that landed are in `app/routers/billing.py` and `app/routers/payments.py`,
      which is W4's code. It was done here because without it E2E-3 could not be written at
      all and W4's exit gate stays theatre — the same reasoning that gave this lane the
      App.tsx exception. The parent app's own `billingClient.ts` is untouched; the container
      implements the same interface, so lane MONEY's file changes when lane MONEY changes it.
      AMENDED AGAIN 2026-08-26. The standing-order half is closed too:
      `GET /me/standing-order` answers the one question `hasActiveSubscription` asks, and
