  - id: HB-c11-pricing-is-per-student
    kind: conflict
    title: C11 — §5.10 prices per group; the club prices per student by training volume
    why: >-
      §5.10 attaches a price_plan to a GROUP, falling back to the class, and the billing
      run creates one charge for every active enrollment. The club prices differently: the
      manager sets an amount per STUDENT from how often they train — about 300 for twice a
      week, about 500 for daily — independent of which groups those sessions belong to.
      Under the spec's rule a student in both the competition group and the teenagers group
      receives two tuition charges every month, at two different group prices, silently and
      forever. §5.4's prose compounds it by asserting 'each child is enrolled in one group';
      the schema never enforced that, §3.3 describes enrollment as a link table, and the
      club contradicts it outright. The sentence is simply wrong. Two consequences land in
      W2's contract commit, because that is where enrollment is built: the billing run must
      produce ONE tuition charge per student per period rather than one per enrollment, and
      the amount must hang off something the manager sets per student.
    resolution: >-
      Closed 2026-08-25 in W2's contract commit. The price moved off the group and off the
      enrollment onto the STUDENT: student.price_plan_id, with price_plan rescoped from
      group_id/class_id to sessions_per_week — 'פעמיים בשבוע 300', 'כל יום 500'. The
      billing run's unit of work is now the student, and charge's idempotency index is
      keyed uq_charge_student_period_kind rather than on enrollment_id, which is the
      structural half: an enrollment-keyed index does not merely fail to prevent the double
      charge, it permits it. charge.enrollment_id is gone so nothing invites the
      per-enrollment run back. SPEC §5.4's 'each child is enrolled in one group' is
      corrected to 'one or more groups', and §5.10's pricing, billing-run step 1, step 5's
      uniqueness and step 6's registration fee are rewritten to match. Settled together
      with C12 — see its resolution for the shared reader.
    blocks: W2
    status: closed
    opened: 2026-08-25
    closed: 2026-08-25
    source: SPEC §5.4, §5.10 · the club, 2026-08-25
  - id: HB-c12-partial-attendance
    kind: conflict
    title: C12 — a student may attend only some of their group's weekly sessions
    why: >-
      §5.7's four attendance states have no way to say 'this student was not expected
      today'. A student enrolled in a group that trains twice a week who attends once is
      marked absent_unexcused every week forever, and reads as fifty percent attendance
      while attending everything they signed up for — so §5.14's gap count becomes noise and
      a manager chases parents who are missing nothing. Money is already correct: §5.7 says
      the monthly fee buys the slot rather than the sessions. Reporting is not. The club
      confirmed the manager sets, per student, which day or days they come, so `enrollment`
      has to carry that pattern and `enrollment` is built in W2's contract commit. It is the
      same input C11 depends on — 'twice a week' is both what a student attends and what
      they pay for — so the two must be settled together or the second will contradict the
      first.
    resolution: >-
      Closed 2026-08-25 in W2's contract commit. enrollment.attends_weekdays SMALLINT[]
      carries which of a group's weekly sessions a student is expected at, 0-6 matching
      group_schedule_rule.weekday; NULL means all of them and is the default and the common
      case. Weekdays rather than group_schedule_rule_ids on purpose — §5.6 rewrites future
      sessions when a rule changes, so a rule id would dangle and silently drop the student
      off the roster, while 'Tuesday' means the same thing before and after. Deliberately
      NOT a fifth attendance state: §5.7's four record what somebody said, expectation
      records what was asked of them, and the axes are independent. The roster lists the
      expected; students enrolled but not expected today sit beneath it in a collapsed
      'לא אמורים להגיע היום' section, are still markable, are never touched by סמן הכל
      נוכח, and never enter a §5.14 denominator. Settled together with C11 as one decision:
      app/services/people/attendance_pattern.py is the single reader both the roster and
      the billing run go through — expected_weekdays, is_expected, and weekly_volume, the
      last being the sessions-per-week figure a manager sets the student's price against.
    blocks: W2
    status: closed
    opened: 2026-08-25
    closed: 2026-08-25
    source: SPEC §5.7, §5.14 · the club, 2026-08-25
