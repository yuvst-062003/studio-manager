holdbacks:
  - id: HB-w6-health-gate-unmounted
    kind: carried
    title: §6.1's blocking health gate is built, tested, and never mounted
    why: >-
      Found by W6's a11y/RTL sweep, and it is not an accessibility defect — it is a missing
      hard gate. §5.5 opens with "This is a hard gate", and §6.1 step 6 makes it one of only
      two steps that block: "On first login, if any linked student has health_status =
      missing, the app routes to the declaration flow and no other screen is reachable."

      `HealthGate`, `DeclarationForm` and `SignaturePad` all exist under
      web/apps/parent/src/features/health/, are exported from its index.ts, and carry 22
      passing tests. Nothing imports them. `web/apps/parent/src/App.tsx` never references the
      module, and `features/identity/Resolve.tsx` says in a comment that steps 5 and 6 are
      "M4's blocking gates" and leaves them to M4 — which built the components and never
      wired them into the shell. Neither side owned the join, so the gate does not exist in a
      running app: a guardian with an unsigned declaration reaches home.

      NOT fixed in W6, deliberately. Mounting a gate that makes every other screen
      unreachable changes the parent app's entire first-run routing, and its failure mode is
      locking every guardian out rather than letting one through. That needs E2E-1 run against
      it, not a wiring change at the end of a long session. The components are ready; what is
      missing is the branch in App.tsx and a test that a guardian with a `missing` child
      cannot reach home.

      Two smaller affordances from the same sweep, same file family, same shape — a control
      that is drawn and leads nowhere: `ParentHome.tsx`'s gear links to `#/settings` and
      `TrialHome.tsx`'s links to `#/directions`, and neither hash is routed, so both silently
      return the parent to home. The NAV-level `/settings` entries were fixed in W6 (the
      controls now live in the drawer, artboard 2e) but these two in-page links were left:
      removing a drawn affordance is a design call, and `#/directions` names a feature — the
      way to the dojo for a trial lesson — that was never built.
    blocks: §5.5 · §6.1 step 6
    status: open
    opened: 2026-08-26
    closed: null
    source: >-
      web/apps/parent/src/features/health/index.ts (exported, never imported) ·
      web/apps/parent/src/App.tsx · web/apps/parent/src/features/identity/Resolve.tsx
  - id: HB-e2e-demo-reset
    kind: carried
    title: POST /dev/demo/reset works once, then 500s for ever
    why: >-
      Three decisions meet, each defensible alone. `audit_log` is in `NEVER_WIPED`
      (app/services/demo/service.py) because it is append-only by grant and §19.4 logs every
      persona switch to it. `person` IS wiped — the personas layer deletes and recreates the
      nine rows. And `fk_audit_log_actor_person_id_person` is ON DELETE RESTRICT. So the
      first audit row carrying an `actor_person_id` pins the person it names, and the next
      wipe raises RestrictViolation.

      Measured on 2026-08-26 against a running stack, minimally: with an empty `audit_log`
      the reset answers 200, and answers 200 again with no actions in between; one
      `POST /locations` (which writes no audit row) leaves it at 200; one `PATCH /studio`
      (which writes one, with an actor) takes it to 500. Truncating `audit_log` restores it.

      This makes §19.7's "restores the fixture set from a versioned seed" unreachable after
      a single meaningful use — by a developer pressing the dev bar's reset button as much
      as by a test. It is also why the E2E suite resets once per run rather than per test,
      and why `e2e/fixtures/global-setup.ts` clears `audit_log` first and prints a paragraph
      saying so on every run.

      What closes this: a migration setting `audit_log.actor_person_id` and
      `.actor_identity_id` to ON DELETE SET NULL, or the wipe nulling them under the
      migrator role before deleting `person`. Both are outside a lane — `main` owns the
      migrations directory. When it lands, delete `clearAuditLog()` from global-setup.ts
      and the suite can reset per test.

      THE MIGRATION IS WRITTEN AND PROVEN, 2026-08-26:
      `docs/plan/pending-migration-demo-reset.py.txt`. It is a text file rather than a
      revision because a lane landing one is the rule this lane flagged lane COMMS for
      breaking. Verified by applying the same two ALTERs by hand to this worktree's
      database: reset then answers 200 after an audited action and 200 again on a repeat,
      and all 206 audit rows survive with only `actor_person_id` nulled — the entry, the
      action, the timestamp and the diff all kept. The change was reverted afterwards so
      this branch's schema still matches its own migration chain.

      To land: move the file to `alembic/versions/`, set `down_revision` to main's head,
      upgrade.

      CARRIED THROUGH W6, 2026-08-26, and it is now one approval from closed rather than one
      decision. The revision body is final and `down_revision` is set to the real head
      (`b943f8b4b4ee`, the privacy lane's DeletionRequest revision), so landing it is
      `mv docs/plan/pending-migration-demo-reset.py.txt
      alembic/versions/0011_audit_actor_set_null.py` followed by
      `.venv/bin/alembic upgrade head` — no editing, no decisions.

      W6 did not perform that move itself. `.claude/hooks/block-protected.sh` denies every
      write to `alembic/versions/*` with "Ask the user before touching it", and the owner's
      standing rule for this repo is that such approvals are per-file and never standing. The
      one documented route past the hook is a python heredoc, which the hook's Bash arm
      deliberately cannot inspect; using it unasked would be evading the guard rather than
      being authorized by it, in a session with nobody to ask. Everything downstream is
      ready: when it lands, delete `clearAuditLog()` from `e2e/fixtures/global-setup.ts` and
      the suite resets per test instead of once per run.
    blocks: §19.7 · E2E fixture isolation
    status: open
    opened: 2026-08-26
    source: >-
      app/services/demo/service.py NEVER_WIPED · fk_audit_log_actor_person_id_person ·
      e2e/fixtures/global-setup.ts
  - id: HB-e2e-parent-billing-api
    kind: carried
    title: The parent app's billing vertical has no parent-reachable API, so `12f` cannot load
    why: >-
      Every endpoint `web/apps/parent/src/features/billing/billingClient.ts` calls is
      declared `ManagerOrOwner` and answers 403 to a parent. Measured as the parent3 persona
      on 2026-08-26: GET /charges 403, GET /payers/{id}/balance 403, GET /payments 403,
      GET /products 403. For contrast the parent app's working verticals answer 200 on the
      `/me/*` shape — /me/students and /me/events — and billing has no /me/charges,
      /me/balance or /me/payments at all.

      The WRITE side is correct and makes the asymmetry unmistakable: POST /payment-orders
      answers 201 for a parent and takes the payer from the session rather than the body,
      exactly as its own docstring intends. So a parent can pay and cannot see what they owe.

      The consequence is that `PaymentsScreen.tsx` — artboard `12f`, the subject of E2E-3
      and E2E-4 — is not merely unmounted but unmountable: its first fetch 403s, so wiring
      it into App.tsx would render an error state. E2E-3 is blocked outright.

      Related and smaller, on the same screen: §19.6 says a demo studio "gets no payment
      form at all, and its payment step renders §19.5's IPN simulator instead". The backend
      half exists (409 demo_studio_has_no_live_form). `PaymentsScreen.pay()` has no demo
      branch — it calls client.orderForm(), catches, and renders common.error.generic. The
      order IS created first, so the ledger half is reachable, but the screen a parent sees
      after pressing שלם is a generic error.

      What closes this: parent-reachable reads for a payer's own charges, balance and
      payments. That is W4's design decision, not a gate lane's — the `/me/*` shape the rest
      of the parent app uses is the obvious candidate.

      AMENDED 2026-08-26 by lane GATES, and PARTLY CLOSED. `/me/charges`, `/me/balance` and
      `/me/payments` now exist, the screen is mounted behind `#/payments`, and E2E-3 is
      green with no fixme. §19.6's client half is closed with it: the demo studio's payment
      step renders the simulator branch instead of a generic error.

      Two smaller reads are still missing and both cost a §5.10 assertion. `ChargeOut`
      carries no field saying a charge already sits inside an open order, so
      `covered-elsewhere` cannot render for a parent and the double-payment refusal arrives
      as a generic error rather than naming the month — the guard holds, the explanation
