<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success - Gladiator Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            rubik: ['Rubik', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#002652',
              dark: '#001938',
              primary: '#003874',
              accent: '#1f6b3f',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Ambient background grid and glow */
    .tatami-texture {
      background-color: #001f44;
      background-image: 
        radial-gradient(circle at 50% 36%, rgba(20, 85, 160, 0.45) 0%, rgba(0, 31, 68, 0.95) 75%, #00142e 100%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
    }

    /* Crest spring and halo ripple */
    @keyframes crestSpring {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }
      60% {
        transform: scale(1.04);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes haloRipple {
      0% {
        transform: scale(0.85);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .crest-enter {
      animation: crestSpring 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .halo-effect {
      animation: haloRipple 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    /* SVG Stroke Checkmark & Sweep Ring */
    .circle-sweep {
      stroke-dasharray: 210;
      stroke-dashoffset: 210;
      animation: ringSweep 0.75s ease-out 0.4s forwards;
    }

    .check-draw {
      stroke-dasharray: 45;
      stroke-dashoffset: 45;
      animation: checkStroke 0.45s cubic-bezier(0.65, 0, 0.35, 1) 0.8s forwards;
    }

    @keyframes ringSweep {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes checkStroke {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Fade up for content items */
    .fade-up {
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUpItem {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .crest-enter, .halo-effect, .circle-sweep, .check-draw, .fade-up {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-[#00142e] text-white flex justify-center items-center min-h-screen p-0 m-0">

  <!-- Mobile screen container (390 x 844) -->
  <main class="relative w-[390px] h-[844px] tatami-texture overflow-hidden flex flex-col justify-between shadow-2xl">
    
    <!-- Top Bar: Close control positioned inline-start (in RTL: top-right) -->
    <header class="w-full pt-8 px-5 flex items-center justify-between z-20">
      <!-- 44x44 tap target close control -->
      <button 
        type="button" 
        aria-label="סגור מסך וחזור לאפליקציה" 
        class="w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all flex items-center justify-center text-white/90 backdrop-blur-md focus:outline-none focus:ring-2 focus:ring-[#6aa9e0]"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- Discreet club badge indicator -->
      <span class="text-xs tracking-wider text-white/40 uppercase font-medium">Gladiator Club</span>
    </header>

    <!-- Center Content: Immersive Hero Payment Confirmation -->
    <section class="flex-1 flex flex-col items-center justify-center px-6 -mt-2 z-10 text-center">
      
      <!-- Crest + Luminous Halo Ring -->
      <div class="relative w-28 h-28 flex items-center justify-center mb-6">
        <!-- Ripple Halo -->
        <div class="absolute inset-0 rounded-full border border-sky-400/50 halo-effect pointer-events-none"></div>
        <div class="absolute -inset-2 rounded-full bg-sky-500/10 blur-md pointer-events-none"></div>

        <!-- Crest 96px (24 in rem) springing in -->
        <div class="w-24 h-24 rounded-full bg-[#002a5c] border-2 border-white/25 shadow-xl flex flex-col items-center justify-center crest-enter overflow-hidden relative">
          <!-- Club crest illustration icon -->
          <div class="w-10 h-10 mb-1 rounded-full bg-[#ba1a1a] flex items-center justify-center shadow-inner">
            <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3L6 11h3.5v7h5v-7H18L12 3z"/>
            </svg>
          </div>
          <span class="text-[10px] font-bold tracking-tight text-white/95 leading-tight">גלאדיאטור</span>
          <span class="text-[8px] tracking-widest text-sky-200/80 font-medium uppercase">JUDO CLUB</span>
        </div>
      </div>

      <!-- Outlined Success Ring & Checkmark with animated stroke -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/15 border border-emerald-400/30 backdrop-blur-sm mb-4 fade-up" style="animation-delay: 0.35s;">
        <svg class="w-5 h-5 text-emerald-400 flex-shrink-0" viewBox="0 0 70 70" fill="none">
          <!-- Outer circle stroke -->
          <circle class="circle-sweep" cx="35" cy="35" r="30" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
          <!-- Animated checkmark stroke -->
          <polyline class="check-draw" points="22,35 31,44 48,27" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="text-xs font-semibold text-emerald-300">התשלום בוצע בהצלחה</span>
      </div>

      <!-- Headline "שולם" in Display weight -->
      <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2 fade-up" style="animation-delay: 0.5s;">
        שולם
      </h1>

      <!-- Amount: tabular, non-breaking with shekel symbol -->
      <div class="flex items-baseline justify-center text-white mb-1.5 fade-up" style="animation-delay: 0.6s;">
        <span class="text-5xl font-black tracking-tight tabular-nums" style="font-variant-numeric: tabular-nums;">
          350
        </span>
        <span class="text-3xl font-extrabold text-sky-200 mr-1 select-none">₪</span>
      </div>

      <!-- Month & Child name caption -->
      <p class="text-base text-slate-200 font-medium mb-3 fade-up" style="animation-delay: 0.7s;">
        שכר לימוד לחודש אוקטובר • עבור <span class="text-white font-semibold">איתי לוי</span>
      </p>

      <!-- Confirmation Number: RTL line, LTR number format -->
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded bg-white/5 border border-white/10 text-xs text-slate-300 fade-up select-all" style="animation-delay: 0.8s;">
        <span class="text-slate-400">מספר אישור:</span>
        <bdo dir="ltr" class="font-mono font-medium tracking-wide text-sky-200">GLD-849204-IL</bdo>
      </div>

    </section>

    <!-- Bottom Actions: Pinned above safe area -->
    <footer class="w-full px-6 pb-9 pt-3 flex flex-col items-center gap-3 z-20">
      <!-- Secondary quiet link: payment history (min 44px height) -->
      <a 
        href="#" 
        class="min-h-[44px] flex items-center justify-center text-sm font-medium text-sky-200/80 hover:text-white transition-colors focus:outline-none focus:underline"
      >
        צפייה בהיסטוריית תשלומים וקבלות
      </a>

      <!-- Primary Action Button: 44px min, 2px rounded corners as specified in design system -->
      <button 
        type="button" 
        class="w-full h-12 bg-white text-[#002652] hover:bg-slate-100 active:bg-slate-200 font-bold text-base rounded-[2px] transition-all shadow-lg active:scale-[0.99] flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#001f44] focus:ring-white"
      >
        המשך לאפליקציה
      </button>
    </footer>

  </main>

</body>
</html>
