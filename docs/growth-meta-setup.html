<style id="app-css">
  :root {
    --navy: #003874; --navy-lift: #1a4f95;
    --ground: #f5f6f8; --surface: #ffffff; --surface-sunk: #eceff4;
    --ink: #111927; --ink-2: #4c586b; --ink-3: #7a869a;
    --rule: #d8dee8; --rule-soft: #e7ebf1;
    --done: #1f6f4e; --done-bg: #e8f4ee;
    --queue: #a0561b; --queue-bg: #fbf0e4;
    --risk: #a32222; --risk-bg: #fbeaea;
    --on-navy: #ffffff;
    --f-display: "Archivo", "Rubik", "Helvetica Neue", Arial, sans-serif;
    --f-body: "Source Serif 4", Georgia, "Rubik", "Times New Roman", serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, "Rubik", monospace;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #8fb5e6; --navy-lift: #b4d0f2;
      --ground: #0e1520; --surface: #151e2b; --surface-sunk: #1b2634;
      --ink: #e8edf5; --ink-2: #a8b4c6; --ink-3: #7e8ca1;
      --rule: #2c3a4c; --rule-soft: #232f3f;
      --done: #6cc79b; --done-bg: #143024;
      --queue: #e0a468; --queue-bg: #33230f;
      --risk: #e78d8d; --risk-bg: #351718;
      --on-navy: #0e1520;
    }
  }
  :root[data-theme="dark"] {
    --navy: #8fb5e6; --navy-lift: #b4d0f2;
    --ground: #0e1520; --surface: #151e2b; --surface-sunk: #1b2634;
    --ink: #e8edf5; --ink-2: #a8b4c6; --ink-3: #7e8ca1;
    --rule: #2c3a4c; --rule-soft: #232f3f;
    --done: #6cc79b; --done-bg: #143024;
    --queue: #e0a468; --queue-bg: #33230f;
    --risk: #e78d8d; --risk-bg: #351718;
    --on-navy: #0e1520;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--f-body);
    font-size: 16.5px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--page); margin: 0 auto; padding: 0 26px 88px; }
  .col { max-width: var(--measure); }

  h1, h2, h3, h4, .eyebrow, th, .chip, .num, .dur, .partno { font-family: var(--f-display); }
  h1 { font-size: clamp(2.2rem, 4.6vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em;
       line-height: 1.02; text-wrap: balance; margin: 0 0 16px; }
  h2 { font-size: clamp(1.4rem, 2.4vw, 1.95rem); font-weight: 700; letter-spacing: -0.02em;

  h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.006em; margin: 0 0 6px; }
  h4 { font-size: 0.94rem; font-weight: 700; margin: 0 0 5px; }
  p { margin: 0 0 14px; }
  code { font-family: var(--f-mono); font-size: 0.86em; color: var(--navy); word-break: break-word; }

  .eyebrow { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;

  .lede { font-size: 1.16rem; line-height: 1.46; color: var(--ink-2); }

  header.mast { border-top: 5px solid var(--navy); padding: 40px 0 26px; }
  .mast-meta { display: flex; flex-wrap: wrap; gap: 8px 24px; font-family: var(--f-mono);

  .mast-meta b { color: var(--ink-2); font-weight: 500; }

  /* contents: four parts, so the reader can jump rather than scroll */
  .toc { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px;
         background: var(--rule-soft); border: 1px solid var(--rule-soft); margin: 26px 0 0; }
  .toc a { background: var(--surface); padding: 15px 17px; text-decoration: none; color: inherit;
           display: block; border-bottom: 3px solid transparent; }
  .toc a:hover, .toc a:focus-visible { border-bottom-color: var(--navy); outline: none; }
  .toc .partno { display: block; font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.1em;
                 color: var(--ink-3); margin-bottom: 6px; }
  .toc strong { font-family: var(--f-display); font-size: 0.98rem; font-weight: 700; display: block;
                margin-bottom: 3px; letter-spacing: -0.008em; }
  .toc span.s { font-size: 0.83rem; color: var(--ink-2); line-height: 1.4; }

  section { padding-top: 58px; }
  .part-head { border-top: 2px solid var(--navy); padding-top: 18px; margin-bottom: 24px; }
  .sec-head { margin-bottom: 20px; }
  .sec-head p { color: var(--ink-2); margin-bottom: 0; }

  /* the numbered implementation step — one object, repeated */
  .impl { border: 1px solid var(--rule-soft); background: var(--rule-soft); display: grid; gap: 1px; margin: 0 0 24px; }
  .istep { background: var(--surface); display: grid; grid-template-columns: 40px 1fr; gap: 0 15px;
           padding: 16px 20px 16px 15px; align-items: start; }
  .istep .n { font-family: var(--f-mono); font-size: 0.8rem; font-weight: 600; color: var(--navy);
              padding-top: 1px; font-variant-numeric: tabular-nums; }
  .istep p { margin: 0 0 9px; font-size: 0.95rem; color: var(--ink-2); max-width: 64ch; }
  .istep p:last-child { margin-bottom: 0; }
  .istep .who { display: inline-block; font-family: var(--f-display); font-size: 0.64rem; font-weight: 700;
                letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; margin-inline-start: 8px;
                vertical-align: 2px; border: 1px solid currentColor; }
  .who.you { color: var(--navy); background: var(--surface-sunk); }
  .who.club { color: var(--queue); background: var(--queue-bg); }
  .who.meta { color: var(--ink-3); }

  pre { margin: 9px 0 0; padding: 11px 13px; background: var(--surface-sunk); border: 1px solid var(--rule-soft);
        overflow-x: auto; font-family: var(--f-mono); font-size: 0.78rem; line-height: 1.55; color: var(--ink); }
  pre code { color: inherit; font-size: inherit; }

  .note { border: 1px solid var(--rule); border-inline-start: 3px solid var(--navy); background: var(--surface);
          padding: 15px 18px; margin: 0 0 22px; }
  .note.warn { border-inline-start-color: var(--risk); }
  .note.warn .eyebrow { color: var(--risk); }
  .note p:last-child { margin-bottom: 0; }
  .note .eyebrow { color: var(--navy); }

  .gotcha { margin-top: 10px; padding: 9px 12px; background: var(--risk-bg);
            border-inline-start: 3px solid var(--risk); font-size: 0.88rem; line-height: 1.48; color: var(--ink); }
  .gotcha b { font-family: var(--f-display); font-weight: 700; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--rule-soft); background: var(--surface); margin-bottom: 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  th, td { text-align: start; padding: 9px 16px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }

       color: var(--ink-3); background: var(--surface-sunk); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.k { font-family: var(--f-mono); font-size: 0.8rem; color: var(--navy); white-space: nowrap; }
  .heb { font-family: "Rubik", var(--f-body); }

  /* the bot script, as a conversation */
  .chat { background: var(--surface); border: 1px solid var(--rule-soft); padding: 18px; margin-bottom: 22px;

  .msg { padding: 9px 13px; font-size: 0.9rem; line-height: 1.5; max-width: 84%; }
  .msg.them { background: var(--surface-sunk); align-self: flex-start; }
  .msg.us { background: var(--done-bg); align-self: flex-end; }
  .msg .rowlist { display: block; margin-top: 7px; border-top: 1px solid var(--rule); padding-top: 7px;
                  font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-2); }
  .msg .rowlist i { display: block; font-style: normal; padding: 2px 0; }
  .tag { font-family: var(--f-mono); font-size: 0.62rem; letter-spacing: 0.08em; color: var(--ink-3);
         text-transform: uppercase; align-self: flex-start; }
  .tag.r { align-self: flex-end; }

  /* the tickable account steps */
  .ledger { border: 1px solid var(--rule-soft); background: var(--rule-soft); display: grid; gap: 1px; }
  .step { background: var(--surface); display: grid; grid-template-columns: 44px 1fr; gap: 0 16px;
          padding: 15px 20px 15px 14px; align-items: start; }
  .step.is-done { background: var(--done-bg); }
  .step .gutter { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 2px; }
  .num { font-family: var(--f-mono); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-3); }
  .step.is-done .num { color: var(--done); }
  .step-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 12px; margin-bottom: 3px; }
  .step-head h3 { margin: 0; }
  .dur { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .step p { margin: 0; font-size: 0.93rem; color: var(--ink-2); max-width: 64ch; }

  .tick { width: 22px; height: 22px; border: 1.5px solid var(--rule); background: var(--surface);
          cursor: pointer; padding: 0; display: grid; place-items: center; color: transparent;
          font-size: 13px; line-height: 1; transition: border-color .12s, color .12s, background .12s; }
  .tick:hover:not(:disabled) { border-color: var(--navy); }
  .tick:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .tick[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--on-navy); }
  .tick:disabled { cursor: not-allowed; opacity: .45; }

  .progress { display: flex; align-items: baseline; gap: 14px; margin: 22px 0 0; }
  .progress .count { font-family: var(--f-display); font-size: 1.4rem; font-weight: 800;
                     letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .progress .of { font-family: var(--f-mono); font-size: 0.74rem; color: var(--ink-3); }
  .track { flex: 1; height: 6px; background: var(--surface-sunk); border: 1px solid var(--rule-soft);
           overflow: hidden; min-width: 110px; }
  .track i { display: block; height: 100%; background: var(--navy); transition: width .25s ease; }

  .vars { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 1px;
          background: var(--rule-soft); border: 1px solid var(--rule-soft); }
  .var { background: var(--surface); padding: 12px 14px; display: flex; gap: 11px; align-items: flex-start; }
  .var.is-done { background: var(--done-bg); }
  .var .k { font-family: var(--f-mono); font-size: 0.76rem; color: var(--navy); word-break: break-all; line-height: 1.4; }
  .var .w { font-size: 0.8rem; color: var(--ink-3); display: block; margin-top: 2px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); gap: 1px;
           background: var(--rule-soft); border: 1px solid var(--rule-soft); margin-bottom: 22px; }
  .card { background: var(--surface); padding: 17px 19px; }
  .card p { font-size: 0.89rem; color: var(--ink-2); margin: 0; line-height: 1.5; }
  .card.bad h3 { color: var(--risk); }

  .status { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.03em; color: var(--ink-3);
            margin-top: 10px; min-height: 1.2em; }
  .status[data-tone="err"] { color: var(--risk); }

  footer.foot { margin-top: 62px; padding-top: 18px; border-top: 1px solid var(--rule);
                font-size: 0.82rem; color: var(--ink-3); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 560px) {
    .wrap { padding: 0 18px 64px; }
    .istep { grid-template-columns: 30px 1fr; gap: 0 11px; padding: 14px 14px 14px 11px; }
    .step { grid-template-columns: 34px 1fr; padding: 14px 14px 14px 10px; gap: 0 12px; }
    .msg { max-width: 94%; }
  }
</style>

<script id="app-js">
(function () {
  'use strict';

  var FONTS =
    '<link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@400;500;700&display=swap">';

  // ═══ PART 1 ═══ provisioning a studio's WhatsApp, so the club only presses pay ═══
  var PROVISION = [
    { who: 'you', t: 'Register once as a Meta Tech Provider',
      b: 'One-time, for your company — not per club. This is what lets your app create WhatsApp accounts on behalf of other businesses and hold a token for each. Everything below is impossible without it, and it is the only step that is not per-customer.' },

    { who: 'club', t: 'The club presses Enable and pays',
      b: 'In the Marketing tab. This is the club’s first action and, if the rest works, very nearly their last. Everything before this point in your own setup costs them nothing.' },

    { who: 'you', t: 'Your backend buys a phone number by API',
      b: 'From a telecom provider — Twilio, Telnyx or Vonage. A few shekels a month, bought programmatically, appearing in your account seconds later. No SIM, no shop, no human. You hold a pool and assign one per club.',
      code: 'POST /2010-04-01/Accounts/{sid}/IncomingPhoneNumbers.json\n  → { "phone_number": "+972...", "sid": "PN..." }\n\n# store it against the studio, unregistered, until step 6 completes' },

    { who: 'club', t: 'Embedded Signup opens in a popup',
      b: 'Meta’s own flow, launched from your dashboard. The club owner logs in with Facebook, confirms the business is theirs, and the number you bought in step 3 is pre-filled by you. They are clicking through Meta’s screens, not yours.' },

    { who: 'meta', t: 'Meta sends one verification code to the number',
      b: 'By SMS or voice call. <strong>Because you own the number, the code arrives at your telecom provider</strong>, not on anyone’s phone — so your backend can read it from the provider’s webhook and fill it in. This is the step that turns a five-minute wait into a spinner.',
      code: '# your provider posts the inbound SMS to you\nPOST /webhooks/sms  { "To": "+972...", "Body": "Your WhatsApp code is 123-456" }\n\n# extract, submit to the signup flow, done' },

    { who: 'meta', t: 'The popup closes and hands you three values',
      b: 'The <code>waba_id</code>, the <code>phone_number_id</code>, and an access token scoped to that one client. This is the whole payload — everything the system needs to send and receive for that club.' },

    { who: 'you', t: 'Write one row and the bot is live',
      b: 'Into <code>whatsapp_number</code>, which is per-studio and already exists in the design. Nothing else in the system changes — the webhook, the bot and the approval loop all read this row and do not care how it got there.',
      code: 'whatsapp_number\n  studio_id        ← this club\n  phone_number_id  ← from step 6   (GLOBALLY unique)\n  waba_id          ← from step 6\n  display_number   ← from step 3\n  status           active' }
  ];

  var CANNOT = [
    ['A Facebook login', 'Meta requires a real person to consent that this business is theirs. You cannot click it for them, and no provider can.'],
    ['The club’s own business identity', 'The display name parents see is reviewed and must be the club’s. You cannot show your company’s name on their messages — and you would not want to.'],
    ['Business verification, eventually', 'Needed for higher sending limits, using the club’s own documents. But they can start sending on lower limits <strong>before</strong> verifying — which is what makes "press pay and it works today" nearly true.']
  ];

  var WHY_PER_STUDIO = [
    ['The webhook only tells you the number', 'When a message arrives, Meta says which number it was sent to — not which club. <code>phone_number_id</code> is how the app resolves the tenant. One shared number means a stranger’s message cannot be attributed to any club at all.'],
    ['One number shows one name', 'A parent asking about Gladiator must see the club’s name, not your platform’s. Meta does not let a number vary its display name per conversation.'],
    ['Quality is shared fate', 'A number has one quality rating. One club’s messages getting reported throttles the number — and every club on it stops working at once.'],
    ['Sending limits are per number', 'Meta caps how many people you may message per 24 hours per number. Ten clubs on one number hit the ceiling ten times faster.']
  ];

  // The manual path — what you do for club number one, before any of the above is built.
  var ACCOUNT_STEPS = [
    { id: 'M1', name: 'Meta Business portfolio', dur: 'about an hour',
      b: 'Created at business.facebook.com by the account that will own it. Name it the legal entity name, not the brand. <strong>Add a second admin immediately</strong> — one person with one Facebook account is how clubs lose their Page.' },
    { id: 'M5', name: 'A number that can take one call', dur: 'start today — it has a lead time',
      b: 'Not on consumer WhatsApp, and not anyone’s personal phone. A landline works (Meta verifies by voice call) and is free if the club has one. Otherwise a cloud number from Twilio or Telnyx — no SIM, bought online.' },
    { id: 'M2', name: 'Business verification', dur: '1–5 working days',
      b: 'The <span class="heb">עמותה</span> documents: <span class="heb">בריין בילדינג (ע"ר)</span>, registration <code>580647295</code>. Legal name, never the brand name — that is the most common rejection. Blocks M6, M7 and M9.' },
    { id: 'M3', name: 'Claim the Facebook Page', dur: 'an afternoon',
      b: 'Claim it, do not <em>request access</em> — request access is for an agency working on somebody else’s Page. Runs while M2 sits in the queue.' },
    { id: 'M4', name: 'Instagram → Business, linked to the Page', dur: 'an afternoon',
      b: '<strong>Business, not Creator</strong> — the Content Publishing API is unavailable to Creator accounts and nothing says so until a publish fails. Then check <code>instagram_business_account</code> appears on the Page, or the link did not take.' },
    { id: 'M10', name: 'The ads account', dur: 'about an hour',
      b: 'Free to create; money is only spent by a campaign with a budget. Currency ILS and time zone Asia/Jerusalem — <strong>neither can be changed later</strong>. Set an account spending limit before the first campaign.' },
    { id: 'M6', name: 'WhatsApp Business Account + display name', dur: 'after M2',
      b: 'Add M5’s number, verify it, set the name parents see. <span class="heb">מועדון ג׳ודו גלדיאטור</span> passes review; <span class="heb">הרשמה</span> does not. Record the phone number id and WABA id — numeric, and neither is the phone number.' },
    { id: 'M7', name: 'App, system user, permanent token', dur: 'an afternoon',
      b: 'A <strong>system user</strong> token, never a user token. A user token expires after sixty days and takes publishing and lead delivery down silently — the single most common way a working Meta integration dies.' },
    { id: 'M8', name: 'Webhook', dur: 'an hour',
      b: 'Subscribe to <code>messages</code> on WhatsApp and <code>leadgen</code> on the Page. <strong>Set the verify token in Railway before pressing Verify</strong>, or the handshake fails and the subscription silently does not save.' },
    { id: 'M9', name: 'App Review', dur: 'days to weeks',
      b: 'Eleven permissions, a written use case each, a screencast, and reviewers testing the live webhook. Submit the day the webhook first answers. Budget one resubmission and promise nobody a date.' },
    { id: 'M11', name: 'First Click-to-WhatsApp campaign', dur: 'seven days of spend',
      b: 'A click opens a <strong>72-hour</strong> free window instead of the usual 24. Twenty to thirty shekels a day; below twenty the campaign cannot leave the learning phase. Decide the stop rule before the money.' }
  ];

  var VARS = [
    ['META_APP_ID', 'M7'], ['META_APP_SECRET', 'M7 — also the signature key'],
    ['META_PAGE_ID', 'M3'], ['META_IG_USER_ID', 'M4'],
    ['META_SYSTEM_USER_TOKEN', 'M7 — permanent, never a user token'],
    ['WHATSAPP_PHONE_NUMBER_ID', 'M6 — not the phone number'],
    ['WHATSAPP_WABA_ID', 'M6'],
    ['WHATSAPP_VERIFY_TOKEN', 'M8 — invented by us, set before Verify'],
    ['WHATSAPP_API_VERSION', 'defaults to v21.0']
  ];

  // ═══ PART 2 ═══ the trial bot ═══
  var BOT_IMPL = [
    { t: 'Resolve the studio from the number, never from the sender',
      b: 'The webhook payload carries <code>phone_number_id</code>. Look it up in <code>whatsapp_number</code> and open a tenant session for that studio. It <strong>fails closed</strong> — an unknown number gets no studio and the request is refused rather than guessed at.',
      code: 'POST /webhooks/whatsapp\n  entry[].changes[].value.metadata.phone_number_id  → studio\n  entry[].changes[].value.messages[0].from          → the parent’s number' },

    { t: 'Deduplicate on the message id before doing anything',
      b: 'Meta retries any delivery it did not get a 200 for. Without a unique index on <code>wamid</code>, a retry is a second answer to the same question — and a parent reading the same sentence twice. <strong>The insert is the deduplication</strong>; there is no "have we seen this?" query to race against.',
      code: 'whatsapp_message\n  wamid  varchar(128)  UNIQUE   ← the retry guard\n  body_encrypted  EncryptedBytes ← never plaintext at rest' },

    { t: 'Ask the child’s name, and write the lead the moment you have it',
      b: 'This is the one rule that must not bend. The trial page was rebuilt on 8 September for exactly this: the booking used to be written last, so a parent who filled everything in and abandoned at the final step left the club <em>nothing</em>. A chat is four steps — <strong>create the lead as soon as you have a name and a way to reach them</strong>, and enrich it afterwards. You already have the phone number: it is the number they are messaging from.' },

  function wideTable(rows, head) {
    var h = '<div class="table-scroll"><table><thead><tr>';
    head.forEach(function (c) { h += '<th>' + c + '</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr>';
      r.forEach(function (c, i) { h += i === 0 ? '<th scope="row">' + c + '</th>' : '<td>' + c + '</td>'; });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function partHead(no, title, lede) {
    return '<div class="part-head"><p class="eyebrow">Part ' + no + '</p><h2>' + title + '</h2>' +
      '<p class="col" style="color:var(--ink-2);margin:8px 0 0">' + lede + '</p></div>';
  }

  // ---- render ------------------------------------------------------------
  function render() {
    var doneCount = ACCOUNT_STEPS.filter(function (s) { return state.done[s.id]; }).length;
    var pct = Math.round((doneCount / ACCOUNT_STEPS.length) * 100);
    var vDone = VARS.filter(function (v) { return state.vars[v[0]]; }).length;

    var h = '<div class="wrap">';

    // ── masthead ──
    h += '<header class="mast">' +
      '<p class="eyebrow">Gladiator Judo Club · Growth §20 · how it is built</p>' +
      '<h1>Turning the growth system on</h1>' +
      '<p class="lede col">Four parts, in the order a club meets them: give a studio its own WhatsApp, let a bot book trials into it, let the app write the content and the manager approve it, then publish and find out whether any of it worked. The detail here is the mechanism — the dashboard around it is a separate question.</p>' +
      '<div class="mast-meta">' +
      '<span><b>PLAN</b> docs/superpowers/plans/2026-09-14-growth-system.md</span>' +
      '<span><b>SPEC</b> docs/growth-spec.md</span>' +
      '<span><b>RUNS AT</b> under twenty shekels a month</span>' +
      '</div>' +
      '<div class="toc">' +
      '<a href="#p1"><span class="partno">PART 1</span><strong>The number</strong><span class="s">Giving one studio its own WhatsApp — automatically, so the club only presses pay</span></a>' +
      '<a href="#p2"><span class="partno">PART 2</span><strong>The trial bot</strong><span class="s">A stranger messages and walks out with a booked lesson</span></a>' +
      '<a href="#p3"><span class="partno">PART 3</span><strong>Content and approval</strong><span class="s">The app writes it from real rows; the manager says yes</span></a>' +
      '<a href="#p4"><span class="partno">PART 4</span><strong>Publish and prove it</strong><span class="s">Posting, the ad, and whether any of it produced a member</span></a>' +
      '<a href="#p5"><span class="partno">PART 5</span><strong>The tools</strong><span class="s">What to build, what to rent, what to avoid — and where Hebrew breaks</span></a>' +
      '<a href="#p6"><span class="partno">PART 6</span><strong>The schedule</strong><span class="s">Posting on a cadence without an unattended machine speaking for the club</span></a>' +
      '</div>' +
      '<p class="status" id="status" data-tone=""></p>' +
      '</header>';

    // ── build order note ──
    h += '<section><div class="note"><p class="eyebrow">Reading order is not build order</p>' +
      '<p>This page runs in the order a club experiences the system. <strong>The build order is different</strong>, and it matters: Part 3 needs no Meta account at all, so it ships first and is useful on its own. Parts 1, 2 and 4 wait on a review queue nobody controls. Build the content studio and the approval loop while verification sits in Meta’s queue — otherwise the code waits on the paperwork.</p></div></section>';

    // ══ PART 1 ══
    h += '<section id="p1">' + partHead(1, 'Giving a studio its own WhatsApp',
      'The club presses pay. Everything else is yours to automate — and most of it can be.');

    h += '<div class="sec-head col"><p class="eyebrow">First</p><h3 style="font-size:1.2rem">Not every use is equal</h3>' +
      '<p>Three things get asked for together and they have completely different costs. This decides what to build before any of the plumbing does.</p></div>';
    h += '<div class="cards">';
    UNEQUAL.forEach(function (u) {
      h += '<div class="card' + (u[0] === 'bad' ? ' bad' : '') + '"><h3>' + u[1] + '</h3><p>' + u[2] + '</p></div>';
    });
    h += '</div>';

    h += '<div class="sec-head col"><p class="eyebrow">The constraint everything hangs off</p>' +
      '<h3 style="font-size:1.2rem">One number per studio. Zero per manager.</h3>' +
      '<p>A manager needs no number — they receive approval drafts on their own personal WhatsApp, from the club’s number, and because they reply every message in that exchange is free. The number belongs to the <em>club</em>, and it cannot be shared between clubs for four reasons.</p></div>';
    h += kvTable(WHY_PER_STUDIO);

    h += '<div class="sec-head col"><p class="eyebrow">The mechanism</p>' +
      '<h3 style="font-size:1.2rem">Seven steps, and the club does two of them</h3>' +
      '<p>This is the path every WhatsApp SaaS takes, and it is built for exactly this case.</p></div>';
    h += implList(PROVISION);

    h += '<div class="note warn"><p class="eyebrow">Check this before planning around it</p>' +
      '<p>The shape above — Tech Provider, Embedded Signup, numbers bought by API, one WhatsApp account per client — is how this is done and is stable. <strong>Meta’s current Tech Provider requirements are not</strong>; they have been tightened more than once. Verify them against Meta’s own documentation before this becomes load-bearing.</p></div>';

    h += '<div class="sec-head col"><p class="eyebrow">Walls, not friction</p>' +
      '<h3 style="font-size:1.2rem">Three things you cannot remove</h3></div>';
    h += kvTable(CANNOT);

    h += '<div class="sec-head col"><p class="eyebrow">Meanwhile, for club number one</p>' +
      '<h3 style="font-size:1.2rem">The manual path</h3>' +
      '<p>You have one club. Do this by hand now, prove the bot is worth having, and automate when a second club is waiting. It costs nothing later: <strong>the row these steps fill in is the same row Embedded Signup fills in</strong>, so automating it is a new way of writing the same three values — not a rewrite.</p></div>';
    h += '<div class="progress"><span class="count">' + doneCount + '</span>' +
      '<span class="of">of ' + ACCOUNT_STEPS.length + ' done</span>' +
      '<span class="track"><i style="width:' + pct + '%"></i></span></div>';
    h += '<div class="ledger" style="margin-top:16px">';
    ACCOUNT_STEPS.forEach(function (step) {
      var on = !!state.done[step.id];
      h += '<div class="step' + (on ? ' is-done' : '') + '"><div class="gutter">' +
        '<button class="tick" type="button" data-step="' + step.id + '" aria-pressed="' + on + '"' +
        (writable ? '' : ' disabled') + ' aria-label="' + esc(step.id + ' ' + step.name) + '">✓</button>' +
        '<span class="num">' + step.id + '</span></div><div>' +
        '<div class="step-head"><h3>' + esc(step.name) + '</h3><span class="dur">' + step.dur + '</span></div>' +
        '<p>' + step.b + '</p></div></div>';
    });
    h += '</div>';

    h += '<div class="sec-head col" style="margin-top:34px"><p class="eyebrow">What the manual path hands back</p>' +
      '<h3 style="font-size:1.2rem">Nine values, and none of them typed here</h3>' +
      '<p>Every one is unset today, and every feature that reads one switches itself <em>off</em> when it is missing rather than crashing. Tick a value once it is in Railway’s secrets on the <code>api</code> service.</p></div>' +
      '<div class="note"><p class="eyebrow">Why there is no field to type into</p>' +
      '<p>Three of these are secrets. A published page is stored and readable by everyone it is shared with, so this page records <strong>whether</strong> a value exists and never the value itself.</p></div><div class="vars">';
    VARS.forEach(function (v) {
      var on = !!state.vars[v[0]];
      h += '<div class="var' + (on ? ' is-done' : '') + '">' +
        '<button class="tick" type="button" data-var="' + v[0] + '" aria-pressed="' + on + '"' +
        (writable ? '' : ' disabled') + ' aria-label="' + esc(v[0]) + '">✓</button>' +
        '<span><span class="k">' + v[0] + '</span><span class="w">' + v[1] + '</span></span></div>';
    });
    h += '</div><p class="status">' + vDone + ' of ' + VARS.length + ' recorded.</p></section>';

    // ══ PART 2 ══
    h += '<section id="p2">' + partHead(2, 'The trial bot',
      'A stranger messages the club and walks out with a real booking. Free to run, because they message first — and the only one of the three uses that Meta explicitly permits.');
    h += implList(BOT_IMPL);

    h += '<div class="sec-head col"><p class="eyebrow">The script, end to end</p>' +
      '<h3 style="font-size:1.2rem">Four questions, two of them typed</h3>' +
      '<p>Everything else is a tap. The groups, times and class names below come from rows — the model phrases, it never decides.</p></div><div class="chat">';
    BOT_SCRIPT.forEach(function (m) {
      h += '<div class="msg ' + m[0] + '">' + m[1];
      if (m[2]) {
        h += '<span class="rowlist">';
        m[2].forEach(function (r) { h += '<i>' + r + '</i>'; });
        h += '</span>';
      }
      h += '</div>';
    });
    h += '</div>';

    h += '<div class="sec-head col"><p class="eyebrow">How it finds the right lesson</p>' +
      '<h3 style="font-size:1.2rem">The number picks the club, the conversation picks the rest</h3></div>' +
      '<pre style="max-width:640px"><code>the number  →  which club      (whatsapp_number.phone_number_id)\nthe age     →  which group     (group.age_min / age_max, across every class)\nthe choice  →  which lesson    (class name · day · time, on each row)</code></pre>' +
      '<p class="col" style="margin-top:14px">A studio has several classes and each class has several groups — but the number of phone numbers never grows with them. One club with twenty groups is still one number. Ask about the class explicitly <strong>only</strong> when the age-filtered list overflows WhatsApp’s ten-row cap, which most clubs never hit.</p>';
    h += '</section>';

    // ══ PART 3 ══
    h += '<section id="p3">' + partHead(3, 'Content, and the manager’s yes',
      'The part that solves the real blocker. The owner does not post because they do not know what to post — not because writing takes too long. So this starts from something that actually happened and is already a row.');
    h += implList(CONTENT_IMPL);
    h += '</section>';

    // ══ PART 4 ══
    h += '<section id="p4">' + partHead(4, 'Publishing, the ad, and proving it worked',
      'Approval finally does something. And then the harder question: did any of it bring a child through the door?');
    h += implList(PUBLISH_IMPL);

    h += '<div class="sec-head col"><p class="eyebrow">Self-validation, before it goes out</p>' +
      '<h3 style="font-size:1.2rem">Five checks the system runs on its own output</h3>' +
      '<p>None of these is a human remembering. Each is a gate in code, and each one has a failure it was written after.</p></div>';
    h += kvTable(VALIDATE_BEFORE);

    h += '<div class="sec-head col"><p class="eyebrow">Self-validation, afterwards</p>' +
      '<h3 style="font-size:1.2rem">Four questions the database can already answer</h3>' +
      '<p>This is the half that decides whether to keep doing it — and it needs no new tables.</p></div>';
    h += kvTable(VALIDATE_AFTER);
    h += '</section>';

    // ══ PART 5 ══
    h += '<section id="p5">' + partHead(5, 'The tools',
      'Researched 15 September 2026. The market is crowded and most of it is a solved problem you should rent — but the two things that matter most for this club are the two nobody sells.');

    h += '<div class="sec-head col"><p class="eyebrow">The whole pipeline</p>' +
      '<h3 style="font-size:1.2rem">Eight stages, and you build four of them</h3>' +
      '<p>Idea, style, shot, film, cut, caption, approve, post. The ones marked OURS are ours because no outside tool can see the club’s data or its consent ledger. The rest are crowded markets with free options at the bottom.</p></div>';
    h += wideTable(PIPELINE, ['#', 'Stage', 'Whose', 'What that means']);

    h += '<div class="note warn"><p class="eyebrow">The finding that matters most</p>' +
      '<p><strong>The best-known caption tools render Hebrew backwards.</strong> Submagic — the category leader for captions, 123 languages, claiming 99% accuracy — has Hebrew rendering that 2026 reviews describe as effectively broken: reversed text, disconnected letters. Opus Clip transcribes Hebrew accurately and then draws the words in the wrong order; its users have an open request for RTL support.</p>' +
      '<p>This is the trap the spec predicted and could not yet name: <strong>the problem is never accuracy, it is direction.</strong> Judge any caption tool by looking at the burned-in Hebrew <em>in a player</em> — never at the transcript, and never at the .srt in a text editor. An .srt that reads correctly in code is the single most likely way to ship broken Hebrew subtitles.</p></div>';
    h += wideTable(HEBREW_TRAP, ['Tool', 'What it is good at', 'What it does to Hebrew']);

    h += '<div class="sec-head col" style="margin-top:30px"><p class="eyebrow">The decision, per job</p>' +
      '<h3 style="font-size:1.2rem">Build, rent, or avoid</h3></div>';
    h += wideTable(BUILD_RENT, ['The job', 'Verdict', 'Why']);

    h += '<div class="sec-head col" style="margin-top:30px"><p class="eyebrow">Asked directly</p>' +
      '<h3 style="font-size:1.2rem">Higgsfield, and AI-generated video</h3></div>';
    h += kvTable(HIGGSFIELD);
    h += '</section>';

    // ══ PART 6 ══
    h += '<section id="p6">' + partHead(6, 'Posting on a schedule',
      'Every N days, without ever letting an unattended machine speak in the club’s voice to its parents.');
    h += implList(SCHEDULE_IMPL);

    h += '<div class="sec-head col"><p class="eyebrow">How often, actually</p>' +
      '<h3 style="font-size:1.2rem">The cadence, and the ceiling</h3>' +
      '<p>The 2026 consensus is consistent and slightly disappointing to anyone hoping automation means volume: the gains come from moving off near-zero to a steady rhythm, and then stop.</p></div>';
    h += wideTable(CADENCE, ['What', 'How often', 'Why that number']);
    h += '</section>';

    h += '<footer class="foot">Gladiator Judo Club · Growth §20 · the detailed companion to the growth system page and the implementation plan. ' +
      'Meta’s menu labels move every few months; the permissions, the documents and the queues do not.</footer></div>';

    document.getElementById('root').innerHTML = h;

    document.getElementById('root').querySelectorAll('.tick').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var step = btn.getAttribute('data-step'), v = btn.getAttribute('data-var');
        if (step) { state.done[step] = !state.done[step]; }
        else if (v) { state.vars[v] = !state.vars[v]; }
        render();
        save();
      });
    });
    if (!writable) { say('This view is read-only — ticks are disabled.'); }
  }

  function say(text, tone) {
    var el = document.getElementById('status');
    if (!el) return;
    el.textContent = text || '';
    el.setAttribute('data-tone', tone || '');
  }

  // ---- publishing: rebuild the whole document with the new state block ----
  function buildDocument() {
    var css = document.getElementById('app-css').textContent;
    var js = document.getElementById('app-js').textContent;
    return '<!doctype html><html lang="en"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>Gladiator Growth Build</title>' + FONTS +
      '<style id="app-css">' + css + '</style></head><body>' +
      '<div id="root"></div>' +
      '<script id="state" type="application/json">' + JSON.stringify(state) + '<\/script>' +
      '<script id="app-js">' + js + '<\/script></body></html>';
  }

  function save() {
    if (!artifact || !writable) return;
    say('Saving…');
    clearTimeout(pending);
    pending = setTimeout(function () {
      if (saving) { save(); return; }
      saving = true;
      artifact.publish(buildDocument()).then(function () {
        saving = false; say('Saved.');
      }).catch(function (err) {
        saving = false;
        var code = err && err.code;
        if (code === 'conflict') { return; }
        if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'capability_disabled') {
          writable = false; render(); return;
        }
        if (code === 'rate_limited') { say('Too many changes at once — waiting a moment.', 'err'); return; }
        say('Not saved. Tick it again, or note it elsewhere.', 'err');
      });
    }, 700);
  }

  render();

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (ns) {
      if (ns) { artifact = ns; }
    }).catch(function () { /* design for absence */ });
  }
})();
</script>
