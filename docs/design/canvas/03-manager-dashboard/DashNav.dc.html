<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="width:236px;height:100%;background:#fffefb;border-left:1px solid rgba(23,21,15,.12);display:flex;flex-direction:column;font-family:Rubik,system-ui,sans-serif;color:#17150f;box-sizing:border-box">
  <div style="padding:16px 16px 14px;border-bottom:1px solid rgba(23,21,15,.10);display:flex;align-items:center;gap:11px;cursor:pointer">
    <div style="width:34px;height:34px;border-radius:9px;background:#17150f;display:flex;align-items:center;justify-content:center;flex:none"><div style="width:16px;height:4px;background:#f7f5f1;border-radius:1px"></div></div>
    <div style="flex:1;min-width:0"><div style="font:600 15px/1.2 Rubik;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">מכבי ג'ודו רעננה</div><div style="font:400 11px/1.3 Rubik;color:#6f6b62;margin-top:3px">2 סניפים</div></div>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f6b62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
  </div>

  <div style="flex:1;padding:10px 10px 0;overflow:hidden">
    <div style="font:500 11px/1 Rubik;color:#6f6b62;padding:6px 8px 8px">יומיום</div>
    <div style="{{ sCal }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"></rect><path d="M3 9h18"></path><path d="M8 2v4"></path><path d="M16 2v4"></path></svg><span style="flex:1">לוח שבועי</span></div>
    <div style="{{ sAtt }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5 11 13.5 15.5 9"></path><rect x="3" y="4" width="18" height="17" rx="2.5"></rect></svg><span style="flex:1">נוכחות</span><span style="{{ bAtt }}">4</span></div>
    <div style="{{ sMsg }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"></path></svg><span style="flex:1">הודעות</span></div>

    <div style="font:500 11px/1 Rubik;color:#6f6b62;padding:14px 8px 8px">מועדון</div>
    <div style="{{ sMem }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 20c0-3.5 3.2-5.5 7-5.5s7 2 7 5.5"></path><path d="M17 8h5"></path></svg><span style="flex:1">חניכים</span><span style="{{ bMembers }}">214</span></div>
    <div style="{{ sGrp }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg><span style="flex:1">קבוצות ומחזורים</span></div>
    <div style="{{ sEvents }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4"></path><path d="M8.5 7h7l1.5 4a5 5 0 0 1-10 0Z"></path><path d="M12 15v6"></path><path d="M8 21h8"></path></svg><span style="flex:1">אירועים ותחרויות</span><span style="{{ bEvents }}">2</span></div>
    <div style="{{ sBelt }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18"></path><path d="M3 14h18"></path><path d="M7 4v16"></path></svg><span style="flex:1">חגורות ומבחנים</span></div>
    <div style="{{ sStaff }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3.6"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg><span style="flex:1">צוות</span></div>

    <div style="font:500 11px/1 Rubik;color:#6f6b62;padding:14px 8px 8px">כספים ומסמכים</div>
    <div style="{{ sPay }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"></rect><path d="M2 10h20"></path></svg><span style="flex:1">תשלומים וגבייה</span><span style="{{ bPay }}">12</span></div>
    <div style="{{ sDoc }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v5h5"></path></svg><span style="flex:1">מסמכים והצהרות</span><span style="{{ bDoc }}">3</span></div>
    <div style="{{ sRep }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg><span style="flex:1">דוחות</span></div>
  </div>

  <div style="padding:0 10px 10px">
    <div style="{{ sSet }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.55.87 1.06 1H21a2 2 0 1 1 0 4h-.09c-.51.13-.92.5-1.06 1Z"></path></svg><span style="flex:1">הגדרות</span></div>
  </div>

  <div style="border-top:1px solid rgba(23,21,15,.10);padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer">
    <div style="width:32px;height:32px;border-radius:10px;background:repeating-linear-gradient(135deg,#eeeae1,#eeeae1 5px,#e5e0d5 5px,#e5e0d5 10px);border:1px solid rgba(23,21,15,.12);flex:none"></div>
    <div style="flex:1;min-width:0"><div style="font:500 13px/1.2 Rubik">רותם אבני</div><div style="font:400 11px/1.3 Rubik;color:#6f6b62;margin-top:2px">מנהלת מועדון</div></div>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f6b62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;calendar&quot;,&quot;attendance&quot;,&quot;messages&quot;,&quot;members&quot;,&quot;groups&quot;,&quot;belts&quot;,&quot;staff&quot;,&quot;payments&quot;,&quot;documents&quot;,&quot;reports&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;calendar&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'calendar';
    const item = k => 'display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:10px;cursor:pointer;font:' + (a === k ? '500' : '400') + ' 14px/1 Rubik;margin-bottom:2px;' + (a === k ? 'background:#17150f;color:#f7f5f1' : 'color:#17150f');
    const plain = k => a === k
      ? 'font:400 11px/1 Rubik;color:rgba(247,245,241,.78)'
      : 'font:400 11px/1 Rubik;color:#6f6b62';
    const badge = (k, tone) => {
      if (a === k) return 'font:500 11px/1 Rubik;color:#f7f5f1;border:1px ' + (tone === 'amber' ? 'dashed' : 'solid') + ' rgba(247,245,241,.45);border-radius:20px;padding:3px 7px';
      return tone === 'amber'
        ? 'font:500 11px/1 Rubik;color:#8a5a00;border:1px dashed rgba(138,90,0,.55);border-radius:20px;padding:3px 7px'
        : 'font:500 11px/1 Rubik;color:#b3261e;border:1px solid rgba(179,38,30,.40);border-radius:20px;padding:3px 7px';
    };
    return {
      bAtt: badge('attendance', 'amber'), bDoc: badge('documents', 'amber'), bPay: badge('payments', 'red'),
      bMembers: plain('members'), bEvents: plain('events'),
      sCal:item('calendar'), sAtt:item('attendance'), sMsg:item('messages'), sMem:item('members'),
      sGrp:item('groups'), sBelt:item('belts'), sEvents:item('events'), sStaff:item('staff'), sPay:item('payments'),
      sDoc:item('documents'), sRep:item('reports'), sSet:item('settings')
    };
  }
}

</script>
</body>
</html>
